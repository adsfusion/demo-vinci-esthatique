    <!-- كود الـ JS الخاص بتفعيل الواتساب -->
    <script>
      const bookingForm = document.querySelector('form');
      if (bookingForm) {
        bookingForm.addEventListener('submit', function(e) {
          e.preventDefault();
          
          const inputs = bookingForm.querySelectorAll('input, select, textarea');
          let name = '', phone = '', service = '';

          inputs.forEach(input => {
            if (input.type === 'text' || input.name === 'name') name = input.value;
            if (input.type === 'tel' || input.name === 'phone') phone = input.value;
            if (input.tagName === 'SELECT' || input.name === 'service') service = input.value;
          });

          // رقم الواتساب الخاص بـ VINCI ESTHETIQUE
          const clientWhatsapp = "212661595630"; 

          const message = `Bonjour VINCI ESTHETIQUE,%0ANouvelle demande de rendez-vous:%0A- Nom: ${encodeURIComponent(name)}%0A- Tél: ${encodeURIComponent(phone)}%0A- Service: ${encodeURIComponent(service)}`;

          window.open(`https://wa.me/${clientWhatsapp}?text=${message}`, '_blank');
        });
      }
    </script>
